<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAPPHIRE IQ - Admin Control Panel</title>
    <style>
        :root {
            --primary-glow: #a855f7;
            --primary-btn-start: #9333ea;
            --primary-btn-end: #c084fc;
            --bg-base: #030107;
            --card-bg: rgba(12, 7, 24, 0.85);
            --border-color: rgba(168, 85, 247, 0.2);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { 
            background: var(--bg-base); 
            min-height: 100vh; 
            display: flex; 
            color: #ffffff;
            overflow-x: hidden;
            position: relative;
        }

        .stars-container {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .stars, .stars2 {
            position: absolute;
            top: -100%; left: 0; right: 0; bottom: 0;
            width: 100%; height: 200%;
            display: block;
        }
        .stars {
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2.5px 2.5px at 60px 90px, var(--primary-glow), rgba(0,0,0,0)),
                radial-gradient(2px 2px at 120px 50px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2.5px 2.5px at 180px 120px, var(--primary-glow), rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 250px 250px;
            animation: moveStars 4s linear infinite;
            filter: drop-shadow(0 0 8px #ffffff) drop-shadow(0 0 15px var(--primary-glow));
            opacity: 0.95;
        }
        .stars2 {
            background-image: 
                radial-gradient(3px 3px at 50px 150px, #d8b4fe, rgba(0,0,0,0)),
                radial-gradient(3.5px 3.5px at 250px 80px, var(--primary-glow), rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 350px 350px;
            animation: moveStars 7s linear infinite;
            filter: drop-shadow(0 0 10px var(--primary-glow));
            opacity: 0.85;
        }
        @keyframes moveStars {
            0% { transform: translateY(0); }
            100% { transform: translateY(50%); }
        }

        .main-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            z-index: 5;
            min-height: 100vh;
            background: rgba(3, 1, 7, 0.6);
            padding: 30px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .panel-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            backdrop-filter: blur(15px);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.2);
        }

        .panel-box-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 15px;
            font-weight: bold;
            color: #c084fc;
        }

        .back-btn { 
            display: inline-block; 
            margin-bottom: 15px; 
            color: #c084fc; 
            text-decoration: none; 
            font-size: 12px; 
            font-weight: bold; 
            transition: 0.2s;
        }
        .back-btn:hover { color: #fff; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 13px; }
        th { color: #a855f7; font-weight: bold; }
        
        .btn { padding: 6px 12px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; font-size: 11px; margin-right: 4px; transition: 0.2s; }
        .btn-danger { background: #ef4444; color: #fff; }
        .btn-danger:hover { background: #dc2626; }
        .btn-success { background: #22c55e; color: #fff; }
        .btn-success:hover { background: #16a34a; }
        .btn-warning { background: #f59e0b; color: #fff; }
        .btn-warning:hover { background: #d97706; }

        input[type="number"] { 
            width: 75px; 
            padding: 6px; 
            background: rgba(8, 4, 15, 0.95); 
            border: 1px solid var(--border-color); 
            color: #fff; 
            border-radius: 6px; 
            outline: none;
            font-size: 12px;
        }
        input[type="number"]:focus { border-color: var(--primary-glow); }
    </style>
</head>
<body>

    <div class="stars-container">
        <div class="stars"></div>
        <div class="stars2"></div>
    </div>

    <div class="main-container">
        <a href="/dashboard" class="back-btn">&larr; Back to Dashboard</a>
        
        <div class="panel-box">
            <div class="panel-box-header">
                <span>ADMIN CONTROL PANEL — USER MANAGEMENT</span>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Username</th>
                        <th>Balance</th>
                        <th>Total Keys</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    <!-- Dynamically loaded -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function loadUsers() {
            fetch('/api/admin/users')
            .then(res => res.json())
            .then(data => {
                if(data.status) {
                    let tbody = document.getElementById('userTableBody');
                    tbody.innerHTML = '';
                    data.users.forEach(user => {
                        tbody.innerHTML += `
                            <tr>
                                <td><strong style="color: #fff;">${user.username}</strong></td>
                                <td style="color: #4ade80; font-weight: bold;">${user.balance} Coins</td>
                                <td>${user.keys_count} Keys</td>
                                <td>
                                    <input type="number" id="amt_${user.username}" value="100" min="1">
                                    <button class="btn btn-success" onclick="modifyBalance('${user.username}', 'add')">+ Add</button>
                                    <button class="btn btn-warning" onclick="modifyBalance('${user.username}', 'remove')">- Remove</button>
                                    ${user.username !== 'admin' ? `<button class="btn btn-danger" onclick="deleteUser('${user.username}')">Delete</button>` : ''}
                                </td>
                            </tr>
                        `;
                    });
                }
            });
        }

        function modifyBalance(username, action) {
            let amount = document.getElementById(`amt_${username}`).value;
            let formData = new URLSearchParams();
            formData.append('username', username);
            formData.append('amount', amount);
            formData.append('action', action);

            fetch('/api/admin/update_balance', {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                if(data.status) {
                    alert(data.message);
                    loadUsers();
                } else {
                    alert(data.message);
                }
            });
        }

        function deleteUser(username) {
            if(confirm(`Are you sure you want to delete user: ${username}?`)) {
                let formData = new URLSearchParams();
                formData.append('username', username);

                fetch('/api/admin/remove_user', {
                    method: 'POST',
                    body: formData
                })
                .then(res => res.json())
                .then(data => {
                    if(data.status) {
                        alert(data.message);
                        loadUsers();
                    } else {
                        alert(data.message);
                    }
                });
            }
        }

        loadUsers();
    </script>
</body>
</html>
